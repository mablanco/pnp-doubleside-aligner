name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  # Single required check for branch protection (aggregates the matrix).
  ci-success:
    name: ci-success
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs green
        run: |
          if [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "pytest matrix failed: ${{ needs.pytest.result }}"
            exit 1
          fi
