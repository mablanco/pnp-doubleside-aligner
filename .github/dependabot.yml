version: 2
updates:
  # pyproject.toml and the requirements*.txt mirrors, updated together
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to 1.23.7, verified by the calibration/transform audit. Even
      # 1.23.26 changes the golden PDF outputs (#21), so any update needs
      # that verification again and is done by hand.
      - dependency-name: "PyMuPDF"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
